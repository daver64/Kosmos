name: Linux build and tests

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOBS: "4"
      SDL_VIDEODRIVER: offscreen
      SDL_AUDIODRIVER: dummy
      LP_NUM_THREADS: "4"
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Check out Kosmos
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libgl1-mesa-dev libpng-dev libsqlite3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev libwxgtk3.2-dev libgtk-3-dev python3-pil

      - name: Check out pinned simlib
        run: |
          pin="$(tr -d '[:space:]' < SIMLIB_COMMIT)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          git init "$RUNNER_TEMP/simlib"
          git -C "$RUNNER_TEMP/simlib" remote add origin https://github.com/daver64/rsimlib.git
          git -C "$RUNNER_TEMP/simlib" fetch --depth 1 origin "$pin"
          git -C "$RUNNER_TEMP/simlib" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/simlib" rev-parse HEAD)" = "$pin"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKOSMOS_SIMLIB_DIR="$RUNNER_TEMP/simlib" \
            -DKOSMOS_BUILD_JOBS=4 \
            -DSIMLIB_RENDERERS=gl \
            -DSIMLIB_VALIDATE_SHADERS=OFF \
            -DFASTNOISE_DIR="$RUNNER_TEMP/simlib/include" \
            -DGLM_INCLUDE_DIR="$RUNNER_TEMP/simlib/include"

      - name: Build simulator and launcher
        run: cmake --build build -j4 --target kosmos kosmos-launcher

      - name: Run quick regression suite
        run: sh scripts/run-tests.sh
