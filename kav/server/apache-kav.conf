# Apache: reverse proxy for the KosmosAV server. Needs mod_proxy, mod_proxy_http and mod_headers:
#   sudo a2enmod proxy proxy_http headers
# Include this in the virtual host that serves /kosmos over HTTPS. kosmosavd binds 127.0.0.1 only.
# (Run kosmosavd with --base /kosmos/kav/app --secure.)

ProxyPreserveHost Off
ProxyPass        /kosmos/kav/app/ http://127.0.0.1:9480/ timeout=15
ProxyPassReverse /kosmos/kav/app/ http://127.0.0.1:9480/
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
LimitRequestBody 6291456
